[versions]
agp = "9.3.1"
kotlin = "2.4.10"
compose = "1.11.1"
composeRuntime = "1.11.2"
activity = "1.13.0"
coroutines = "1.11.0"

[libraries]
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version = "3.5.2" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version = "3.5.2" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version = "3.5.2" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version = "3.5.2" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version = "3.5.0" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version = "3.5.0" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version = "2.9.6" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version = "2.11.0" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "composeRuntime" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
